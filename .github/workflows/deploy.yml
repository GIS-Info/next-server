name: Deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: deploy-next-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.154.149.214 >> ~/.ssh/known_hosts

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_rsa lighthouse@43.154.149.214 << 'EOF'
          set -euo pipefail

          cd /home/lighthouse/proj/next-server

          git fetch origin main
          git checkout -f origin/main
          echo "Deployed commit: $(git rev-parse HEAD)"

          env/bin/pip install -r requirements.txt
          env/bin/python manage.py migrate --noinput
          env/bin/python manage.py collectstatic --noinput

          sudo systemctl restart next-server
          sudo systemctl is-active --quiet next-server

          curl -fsS --retry 5 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:8000/healthz/
          EOF
